[project]
name = "carepath-ai"
version = "0.1.0"
description = "CarePath AI PoC: simulator, engine, agents and console for ATS della Val Padana"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "duckdb",
    "scikit-learn",
    "xgboost",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "ollama",
]

[project.scripts]
carepath-api = "api.main:run"
carepath-db = "engine.db:main"
carepath-reference-data = "sim.reference_data:main"

[dependency-groups]
dev = [
    "pytest",
    "jupyterlab",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sim", "src/engine", "src/agents", "src/api"]

[tool.pytest.ini_options]
testpaths = ["testing"]
markers = ["acceptance: acceptance criteria AC1–AC19"]
